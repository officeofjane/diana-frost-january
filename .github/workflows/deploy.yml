name: Deploy to GitHub Pages

on:
  push:
    branches:
      - 'main'

jobs:
  build_site:
    runs-on: ubuntu-latest
    env:
      STATICRYPT_PASSWORD: ${{ secrets.PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm i

      - name: build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: |
          npm run build

      - name: Debug variables
        run: |
          echo "=== GitHub Context Variables ==="
          echo "Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Event: ${{ github.event_name }}"
          echo "Env: STATICRYPT_PASSWORD : ${{ github.env.STATICRYPT_PASSWORD }}"
          echo "Secrets: PASSWORD : ${{ secrets.PASSWORD }}"

          echo "=== Shell Environment Variables ==="
          env | grep GITHUB || true
          env | grep CI || true

          echo "=== Check if specific vars are empty ==="
          [[ -z "$GITHUB_SHA" ]] && echo "GITHUB_SHA is empty" || echo "GITHUB_SHA is set"

      - name: encrypt
        shell: bash
        run: |
          cd build && npx staticrypt --short index.html -p "${{ github.env.STATICRYPT_PASSWORD }}" -d . && echo $STATICRYPT_PASSWORD


      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # this should match the `pages` option in your adapter-static options
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
